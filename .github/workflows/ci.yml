# CI do fusion-dash (18/10/2026, Fase 4 do framework). Roda em todo envio e PR.
# O dash é HTML puro, sem build: confere a sintaxe de todo JavaScript (arquivos .js e os <script>
# dentro dos .html) e procura segredo nos commits novos.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
      - name: Autoteste do verificador (tem de saber reprovar)
        run: node scripts/checar_js.mjs --autoteste
      - name: Sintaxe de todo o JavaScript
        run: node scripts/checar_js.mjs

  segredos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 nos commits deste envio
        env:
          ANTES: ${{ github.event.before }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          # O gitleaks só conta commit que ACRESCENTA linha: commit que só apaga sai "0 commits scanned",
          # e está certo. A linha abaixo deixa registrado quantos commits vieram neste envio.
          if [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$ANTES" 2>/dev/null; then
            FAIXA="$ANTES..$GITHUB_SHA"
          else
            FAIXA="-1 $GITHUB_SHA"
          fi
          echo "commits neste envio: $(git rev-list --count $FAIXA)"
          ./gitleaks git --no-banner --redact --log-opts="$FAIXA"
