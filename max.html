<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fusion — Max</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
  html,body{height:100%;background:#09090b;color:#fafafa;overflow:hidden;}
  #bar{height:38px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#111114;border-bottom:1px solid #27272a;}
  #bar a{color:#a1a1aa;text-decoration:none;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  #bar a:hover{color:#fff;}
  #bar .sep{color:#3f3f46;}
  #bar .tit{font-size:13px;font-weight:700;color:#fafafa;}
  #frame{width:100%;height:calc(100dvh - 38px);border:0;display:block;}
  #load{position:absolute;inset:38px 0 0 0;display:flex;align-items:center;justify-content:center;color:#9ca3af;font-size:.9rem;}
</style>
<!-- SDK do Supabase ANTES do auth.js (auth.js cria o client) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>
</head>
<body>
  <div id="bar">
    <a href="/index.html" target="_top">← Voltar ao Fusion OS</a>
    <span class="sep">·</span>
    <span class="tit">Max</span>
  </div>
  <div id="load">Abrindo o Max…</div>
  <iframe id="frame" title="Max" allow="microphone; clipboard-read; clipboard-write"></iframe>
  <script>
    // App do Max (fusion-max) dentro do Fusion OS, com a sessão do portal via #sso=. Sem chave própria em
    // user_roles: quem decide o acesso é o servidor do Max (MAX_DIRETORIA); aqui só se escolhe quem vê o quadro.
    (async function () {
      const s = await fusionAuth.getSession();
      if (!s) { window.location.href = '/index.html'; return; }
      const src = 'https://fusion-max.onrender.com/#sso=' + encodeURIComponent(s.access_token) + '|' + encodeURIComponent(s.refresh_token);
      const frame = document.getElementById('frame');
      frame.onload = function () { const l = document.getElementById('load'); if (l) l.remove(); };
      frame.src = src;
    })();
  </script>
</body>
</html>
